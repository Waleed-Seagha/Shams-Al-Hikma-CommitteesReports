<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3f8f">
<title>محاضر وخطط اللجان</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top no-print">
  <div class="wrap bar">
    <img class="brand" src="logo.jpg" alt="مؤسسة شمس الحكمة">
    <button id="printBtn" class="btn" type="button" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"/><rect x="6" y="14" width="12" height="7" rx="1"/></svg>
      طباعة A4
    </button>
  </div>
</header>
<main class="wrap">
  <div id="notice" class="notice no-print" hidden></div>
  <section class="chooser no-print" aria-labelledby="siteTitle">
    <h1 id="siteTitle">محاضر وخطط اللجان</h1>
    <div class="fields">
      <label class="f"><span><i>1</i>اللجنة</span>
        <select id="selCom" disabled><option value="">جارٍ تحميل اللجان…</option></select></label>
      <label class="f"><span><i>2</i>نوع الوثيقة</span>
        <select id="selType" disabled><option value="">اختر اللجنة أولاً</option></select></label>
      <label class="f" id="fMonth"><span><i>3</i>الشهر</span>
        <select id="selMonth" disabled><option value="">اختر نوع الوثيقة أولاً</option></select></label>
    </div>
    <p id="status" class="status" role="status" hidden></p>
  </section>
  <div id="doc"></div>
</main>
<script src="config.js"></script>
<script src="demo-data.js"></script>
<script src="app.js"></script>
</body>
</html>
